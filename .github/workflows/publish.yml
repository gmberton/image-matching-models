name: Publish to PyPI

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install pypa/build
        run: >-
          python3 -m
          pip install
          build
          --user
      - name: Build a binary wheel and a source tarball
        run: python3 -m build
      - name: Verify build contents
        run: |
          python3 - <<'EOF'
          import glob, tarfile, zipfile

          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          tp = [n for n in names if "/third_party/" in n and n.endswith(".py")]
          assert len(tp) > 1900, f"{whl}: only {len(tp)} third_party .py files (submodules not checked out?)"
          tops = {n.split("/")[0] for n in names}
          assert not tops & {"docs", "tests"}, f"{whl}: ships {tops & {'docs', 'tests'}} at top level"

          sdist = glob.glob("dist/*.tar.gz")[0]
          stp = [n for n in tarfile.open(sdist).getnames() if "/third_party/" in n and n.endswith(".py")]
          assert len(stp) > 1900, f"{sdist}: only {len(stp)} third_party .py files (submodules not checked out?)"

          print(f"OK: {len(tp)} third_party .py in wheel, {len(stp)} in sdist; wheel top-level: {sorted(tops)}")
          EOF
      - name: Store the distribution packages
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vismatch
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1